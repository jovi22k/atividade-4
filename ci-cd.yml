name: CI / CD pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAMESPACE: ${{ secrets.IMAGE_NAMESPACE }}

jobs:
  frontend-ci:
    name: Frontend — CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Lint & format check
        working-directory: frontend
        run: npm run lint --if-present
      - name: Run unit tests
        working-directory: frontend
        run: npm test --if-present -- --ci --reporters=default
      - name: Build frontend
        working-directory: frontend
        run: npm run build --if-present

  backend-ci:
    name: Backend — CI (tests + migrations test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d testdb"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Lint backend
        working-directory: backend
        run: npm run lint --if-present
      - name: Run unit tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://test:test@127.0.0.1:5432/testdb
        run: npm test --if-present
      - name: Run migrations (test DB)
        working-directory: backend
        env:
          DATABASE_URL: postgres://test:test@127.0.0.1:5432/testdb
        run: |
          npm run migrate --if-present || (echo "MIGRATION FAILED" && exit 1)

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: |
            ${{ secrets.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-backend:${{ github.sha }}
            ${{ secrets.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-backend:latest
          context: ./backend
          file: ./backend/Dockerfile
      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: |
            ${{ secrets.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-frontend:${{ github.sha }}
            ${{ secrets.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-frontend:latest
          context: ./frontend
          file: ./frontend/Dockerfile

  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to staging (example via SSH)
        env:
          IMAGE_BACKEND: ${{ secrets.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-backend:${{ github.sha }}
          IMAGE_FRONTEND: ${{ secrets.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-frontend:${{ github.sha }}
        run: |
          echo "Exemplo: ssh -i key deploy@staging 'docker pull $IMAGE_BACKEND && docker pull $IMAGE_FRONTEND && docker-compose -f /srv/app/docker-compose.staging.yml up -d --no-deps --build'"

  deploy-production:
    name: Deploy → Production (manual approval)
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://sua-producao.example
    steps:
      - name: Await manual approval (environment protection in GitHub)
        run: echo "Aguardar aprovação no ambiente production"
      - name: Run migrations in production
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "Rodar migrações com segurança aqui (ex: npm run migrate:prod)"
      - name: Deploy to production
        run: echo "Comandos de deploy para produção"
